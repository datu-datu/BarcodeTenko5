<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>点呼状況ダッシュボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>点呼状況ダッシュボード</h1>
    <div class="nav">
      <span id="conn" class="conn">接続中...</span>
      <a href="/admin">管理画面</a>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card big">
        <div class="label">点呼完了率</div>
        <div id="rate" class="value">—</div>
        <div id="sessionName" class="sub">セッション: -</div>
      </div>
      <div class="card">
        <div class="label">点呼済み / 対象者数</div>
        <div id="total" class="value">0 / 0</div>
        <div id="serverTime" class="sub"></div>
      </div>
      <div class="card">
        <div class="label">セッション外スキャン</div>
        <div id="preSession" class="value">0</div>
        <div class="sub">セッション未割当の受付件数</div>
      </div>
    </section>

    <section class="panel">
      <h2>点呼場所別の人数</h2>
      <table id="locTable">
        <thead><tr><th>点呼場所</th><th class="num">人数</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>リアルタイム受付 <span id="feedCount" class="muted"></span></h2>
      <ul id="feed" class="feed"></ul>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
